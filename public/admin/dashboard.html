<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="../css/admin-dashboard.css">

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script defer src="admin-dashboard.js"></script>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<header class="topbar">
  <h1>🧼 DMV Admin</h1>
  <button id="logoutBtn">Logout</button>
</header>

<!-- ================= STATS ================= -->
<section class="stats">

  <div class="card">
    <h3>Total</h3>
    <p id="total">0</p>
  </div>

  <div class="card">
    <h3>Pending</h3>
    <p id="pending">0</p>
  </div>

  <div class="card">
    <h3>Approved</h3>
    <p id="approved">0</p>
  </div>

  <div class="card">
    <h3>Rejected</h3>
    <p id="rejected">0</p>
  </div>

</section>

<!-- ================= BOOKINGS ================= -->
<main class="container">

  <h2>📅 Bookings</h2>

  <div id="bookingList"></div>

</main>

</body>
</html>
