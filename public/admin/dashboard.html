<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #f5f6f8;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 10px 0;
  border-radius: 10px;
}

button {
  padding: 10px 20px;
  background: red;
  color: white;
  border: none;
  cursor: pointer;
}
</style>

</head>

<body>

<h1>Admin Dashboard</h1>

<button onclick="logout()">Logout</button>

<div class="card" id="data">Loading...</div>

<script>
async function checkAuth() {
  try {
    const res = await fetch("https://dmv-cleaning-backend.onrender.com/api/dashboard", {
      credentials: "include"
    });

    if (!res.ok) {
      window.location.href = "/admin/login.html";
      return;
    }

    const data = await res.json();

    document.getElementById("data").innerHTML = `
      <p>Total Bookings: ${data.totalBookings}</p>
      <p>Total Customers: ${data.totalCustomers}</p>
      <p>Total Profit: $${data.totalProfit}</p>
    `;

  } catch (err) {
    console.error(err);
    window.location.href = "/admin/login.html";
  }
}

async function logout() {
  await fetch("https://dmv-cleaning-backend.onrender.com/api/admin/logout", {
    credentials: "include"
  });

  window.location.href = "/admin/login.html";
}

checkAuth();
</script>

</body>
</html>
