<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../admin/admin-dashboard.css">
</head>

<body>

<h1>🚀 Live Admin Dashboard</h1>

<div class="stats">
  <div>Total Bookings: <span id="total"></span></div>
</div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Service</th>
      <th>Date</th>
      <th>Time</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="tableBody"></tbody>
</table>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const socket = io("https://dmv-cleaning-backend.onrender.com");

socket.on("dashboard-update", (data) => {
  document.getElementById("total").innerText = data.total;

  const table = document.getElementById("tableBody");
  table.innerHTML = "";

  data.bookings.forEach(b => {
    table.innerHTML += `
      <tr>
        <td>${b.name}</td>
        <td>${b.service}</td>
        <td>${b.date}</td>
        <td>${b.timeSlot}</td>
        <td>${b.paymentStatus}</td>
      </tr>
    `;
  });
});
</script>

</body>
</html>
