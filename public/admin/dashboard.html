<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="admin-dashboard.css">
</head>

<body>

<header class="topbar">
  <h2>🧼 DMV Cleaning Admin</h2>
  <button onclick="logout()">Logout</button>
</header>

<section class="stats">
  <div class="card">
    <h3>Total Bookings</h3>
    <p id="totalBookings">0</p>
  </div>

  <div class="card">
    <h3>Revenue</h3>
    <p id="revenue">$0</p>
  </div>
</section>

<section class="table-section">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Service</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
        <th>Price</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="data"></tbody>
  </table>
</section>

<script src="dashboard.js"></script>

</body>
</html>
