<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="../css/dashboard.css">
<script defer src="../js/dashboard.js"></script>
</head>

<body>

<header class="navbar">
  <h2>DMV Cleaning Admin</h2>
  <button id="logoutBtn" class="btn logout">Logout</button>
</header>

<main class="container">

  <!-- STATS -->
  <section class="stats">
    <div class="card">
      <h3>Total Bookings</h3>
      <p id="bookings">0</p>
    </div>

    <div class="card">
      <h3>Customers</h3>
      <p id="customers">0</p>
    </div>

    <div class="card">
      <h3>Total Profit</h3>
      <p id="profit">$0</p>
    </div>
  </section>

  <!-- BOOKINGS TABLE -->
  <section class="table-section">
    <h2>All Bookings</h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="bookingTable"></tbody>
    </table>
  </section>

</main>

</body>
</html>
