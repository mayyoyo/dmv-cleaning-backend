<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="/css/admin-dashboard.css">

<script defer src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script defer src="/js/admin-dashboard.js"></script>

</head>

<body>

<header class="topbar">
  <h3>Admin Dashboard</h3>
  <button id="logoutBtn">Logout</button>
</header>

<main class="main">

  <!-- STATS -->
  <div class="cards">
    <div class="card">
      <h3 id="bookings">0</h3>
      <p>Total Bookings</p>
    </div>

    <div class="card">
      <h3 id="pending">0</h3>
      <p>Pending</p>
    </div>

    <div class="card">
      <h3 id="approved">0</h3>
      <p>Approved</p>
    </div>

    <div class="card">
      <h3 id="rejected">0</h3>
      <p>Rejected</p>
    </div>
  </div>

  <!-- BOOKINGS LIST -->
  <section class="booking-section">
    <h2>📋 Booking Requests</h2>
    <div id="bookingList" class="list"></div>
  </section>

</main>

</body>
</html>
