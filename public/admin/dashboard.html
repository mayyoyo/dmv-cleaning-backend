<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="../js/admin-dashboard.js"></script>

</head>

<body>

<header class="admin-header">
  <h2>📊 DMV Cleaning Admin Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<section class="stats">

  <div class="card">
    <h3>Total Revenue</h3>
    <h2 id="revenue">$0</h2>
  </div>

  <div class="card">
    <h3>Total Bookings</h3>
    <h2 id="bookings">0</h2>
  </div>

  <div class="card">
    <h3>Paid</h3>
    <h2 id="paid">0</h2>
  </div>

  <div class="card">
    <h3>Pending</h3>
    <h2 id="pending">0</h2>
  </div>

</section>

<!-- ================= CHARTS ================= -->
<section class="charts">

  <canvas id="serviceChart"></canvas>
  <canvas id="monthlyChart"></canvas>

</section>

<!-- ================= BOOKINGS TABLE ================= -->
<section>

  <h2>Bookings</h2>

  <button onclick="exportCSV()">📥 Export CSV</button>

  <table id="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Service</th>
        <th>Date</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</section>

</body>
</html>
