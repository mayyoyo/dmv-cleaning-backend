<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<header>🔥 Live Admin Dashboard</header>

<div class="container">

  <div class="stats">

    <div class="card">
      <h3>Bookings</h3>
      <h2 id="bookings">0</h2>
    </div>

    <div class="card">
      <h3>Revenue</h3>
      <h2 id="revenue">$0</h2>
    </div>

  </div>

  <div class="card">
    <h3>Actions</h3>

    <button class="btn-blue" onclick="testBooking()">Test Booking</button>
    <button class="btn-green" onclick="testPayment()">Test Payment</button>
  </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
