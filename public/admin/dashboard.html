<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<!-- <link rel="stylesheet" href="../css/admin.css"> -->
<link rel="stylesheet" href="./css/admin-dashboard.css">
<script src="/socket.io/socket.io.js"></script>
</head>

<body>

<h1>🧼 Admin Dashboard</h1>

<div id="stats"></div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Service</th>
      <th>Date</th>
      <th>Status</th>
      <th>Total</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="tableBody"></tbody>
</table>

<script>
const socket = io();
let bookings = [];

/* ================= LOAD ================= */
async function load() {
  const res = await fetch("/api/bookings");
  bookings = await res.json();
  render();
}

/* ================= RENDER ================= */
function render() {

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  let total = 0;

  bookings.forEach(b => {

    total += b.total || 0;

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${b.name}</td>
      <td>${b.service}</td>
      <td>${b.date}</td>

      <td>
        <span class="badge ${b.paymentStatus}">
          ${b.paymentStatus}
        </span>
      </td>

      <td>$${b.total}</td>

      <td>
        <button onclick="markPaid('${b._id}')">✔ Paid</button>
        <button onclick="deleteBooking('${b._id}')">❌ Delete</button>
        <button onclick="downloadInvoice('${b._id}')">📄 Invoice</button>
      </td>
    `;

    tbody.appendChild(row);
  });

  document.getElementById("stats").innerHTML =
    `<h3>Total Bookings: ${bookings.length} | Income: $${total}</h3>`;
}

/* ================= SOCKET LIVE ================= */
socket.on("init-bookings", (data) => {
  bookings = data;
  render();
});

socket.on("new-booking", (b) => {
  bookings.unshift(b);
  render();
});

socket.on("payment-updated", (b) => {
  const i = bookings.findIndex(x => x._id === b._id);
  if (i !== -1) bookings[i] = b;
  render();
});

socket.on("booking-deleted", (id) => {
  bookings = bookings.filter(b => b._id !== id);
  render();
});

/* ================= ACTIONS ================= */
async function markPaid(id) {
  await fetch(`/api/bookings/${id}/status`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: "PAID" })
  });
}

async function deleteBooking(id) {
  await fetch(`/api/bookings/${id}`, {
    method: "DELETE"
  });
}

/* ================= INVOICE ================= */
function downloadInvoice(id) {

  const b = bookings.find(x => x._id === id);
  if (!b) return;

  const win = window.open("", "", "width=800,height=600");

  win.document.write(`
    <html>
    <body>
      <h1>Invoice</h1>
      <p>Name: ${b.name}</p>
      <p>Service: ${b.service}</p>
      <p>Date: ${b.date}</p>
      <p>Status: ${b.paymentStatus}</p>
      <p>Total: $${b.total}</p>
      <script>
        window.print();
      </script>
    </body>
    </html>
  `);
}

load();
</script>

</body>
</html>
