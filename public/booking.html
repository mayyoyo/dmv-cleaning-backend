<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="./css/booking.css">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>

  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="booking.html">📅 Booking</a>
  </div>
</header>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<!-- SERVICE -->
<select id="service" class="input" onchange="updatePrice()">
  <option value="">Select Service</option>
  <option value="Home Cleaning" data-price="120">Home Cleaning - $120</option>
  <option value="Deep Cleaning" data-price="200">Deep Cleaning - $200</option>
  <option value="Office Cleaning" data-price="150">Office Cleaning - $150</option>
  <option value="Move In/Out Cleaning" data-price="250">Move In/Out - $250</option>
</select>

<select id="timeSlot" class="input">
  <option value="08:00-10:00">08:00-10:00</option>
  <option value="10:00-12:00">10:00-12:00</option>
  <option value="12:00-14:00">12:00-14:00</option>
  <option value="14:00-16:00">14:00-16:00</option>
  <option value="16:00-18:00">16:00-18:00</option>
</select>

<input id="name" class="input" placeholder="Full Name">
<input id="phone" class="input" placeholder="Phone">
<input id="email" class="input" placeholder="Email">
<input id="address" class="input" placeholder="Address">

<h3 id="priceBox">Total: $0</h3>

<button class="btn primary" onclick="handlePayNow()">💳 Pay Now</button>
<button class="btn" onclick="handlePayLater()">📌 Pay Later</button>

</section>

</main>

<script>

const API = "https://dmv-cleaning-backend.onrender.com/api";

let selectedDate = null;
let selectedPrice = 0;
let isBooking = false;

/* ================= PRICE ================= */
function updatePrice() {
  const select = document.getElementById("service");
  const price = select.options[select.selectedIndex].dataset.price;

  selectedPrice = Number(price || 0);

  document.getElementById("priceBox").innerText =
    "Total: $" + selectedPrice;
}

/* ================= FORM ================= */
function getFormData() {
  return {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    service: document.getElementById("service").value,
    total: selectedPrice
  };
}

/* ================= SLOT CHECK ================= */
async function isSlotFull(date, timeSlot) {
  const res = await fetch(API + "/public-bookings");
  const data = await res.json();

  return data.filter(b =>
    b.date === date && b.timeSlot === timeSlot
  ).length >= 3;
}

/* ================= PAY NOW ================= */
async function handlePayNow() {

  if (isBooking) return;
  isBooking = true;

  try {

    const data = getFormData();

    if (!selectedDate || !data.service || !data.timeSlot) {
      alert("Fill all fields");
      isBooking = false;
      return;
    }

    if (await isSlotFull(selectedDate, data.timeSlot)) {
      alert("❌ Slot already full");
      isBooking = false;
      return;
    }

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ...data,
        paymentType: "online"
      })
    });

    const result = await res.json();

    if (!res.ok || !result.success) {
      alert(result.error || "Booking failed");
      isBooking = false;
      return;
    }

    window.location.href =
      `/success.html?bookingId=${result.bookingId}&total=${result.total}&service=${result.service}`;

  } catch (err) {
    alert(err.message);
    isBooking = false;
  }
}

/* ================= PAY LATER ================= */
async function handlePayLater() {

  if (isBooking) return;
  isBooking = true;

  try {

    const data = getFormData();

    if (await isSlotFull(selectedDate, data.timeSlot)) {
      alert("❌ Slot already full");
      isBooking = false;
      return;
    }

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ...data,
        paymentType: "later"
      })
    });

    const result = await res.json();

    if (!res.ok || !result.success) {
      alert(result.error || "Booking failed");
      isBooking = false;
      return;
    }

    window.location.href =
      `/success.html?bookingId=${result.bookingId}&total=${result.total}&service=${result.service}`;

  } catch (err) {
    alert(err.message);
    isBooking = false;
  }
}

/* ================= CALENDAR ================= */
document.addEventListener("DOMContentLoaded", function () {

  const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {

    initialView: "dayGridMonth",

    dateClick: function(info) {
      selectedDate = info.dateStr;
      document.getElementById("selectedDate").innerText =
        "Selected Date: " + selectedDate;
    }
  });

  calendar.render();
});

</script>

</body>
</html>
