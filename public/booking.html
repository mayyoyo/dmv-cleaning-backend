<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="css/booking.css">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

<!-- CONFIG FIRST -->
<script src="js/config.js" defer></script>

<!-- SOCKET -->
<script src="/socket.io/socket.io.js" defer></script>

<!-- MAIN LOGIC -->
<script defer>

const API = "https://dmv-cleaning-backend.onrender.com/api";
const socket = io("https://dmv-cleaning-backend.onrender.com");

let bookings = [];
let selectedDate = null;
let calendar;

/* ================= LOAD BOOKINGS ================= */
async function loadBookings() {
  const res = await fetch(API + "/public-bookings");
  bookings = await res.json();
}

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", async () => {

  await loadBookings();

  calendar = new FullCalendar.Calendar(
    document.getElementById("calendar"),
    {
      initialView: "dayGridMonth",
      height: 500,

      /* ✅ ADD THIS (calendar styling fix) */
      eventDidMount: function(info) {
        info.el.style.backgroundColor = "#111";
        info.el.style.color = "white";
      },

      dateClick: function(info) {
        selectedDate = info.dateStr;

        document.getElementById("selectedDate").innerText =
          "Selected: " + selectedDate;

        updateSlots();
      }
    }
  );

  calendar.render();

  /* ================= SOCKET FIXED ================= */
  socket.on("new-booking", (b) => {
    bookings.unshift(b);
    updateSlots();   // 🔥 MUST
  });

  socket.on("update-slots", (data) => {
    bookings = data;
    updateSlots();   // 🔥 MUST
  });

});

/* ================= FIXED SLOTS FUNCTION ================= */
function updateSlots() {

  const select = document.getElementById("timeSlot");
  if (!selectedDate) return;

  const slots = [
    "08:00-10:00",
    "10:00-12:00",
    "12:00-14:00",
    "14:00-16:00",
    "16:00-18:00"
  ];

  select.innerHTML = `<option value="">Select Time</option>`;

  const booked = bookings
    .filter(b => b.date === selectedDate)
    .map(b => b.timeSlot);

  slots.forEach(slot => {

    const option = document.createElement("option");
    option.value = slot;

    if (booked.includes(slot)) {
      option.textContent = slot + " ❌ Booked";
      option.disabled = true;
      option.style.background = "#ffdddd";
      option.style.color = "red";
    } else {
      option.textContent = slot + " ✅ Available";
    }

    select.appendChild(option);
  });
}

/* ================= BOOK NOW ================= */
async function bookNow() {

  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    service: document.getElementById("service").value
  };

  if (!selectedDate) return alert("Select date");

  try {

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (!res.ok) {
      return alert(result.error || "Booking failed");
    }

    window.location.href =
      "/payment.html?bookingId=" + result.bookingId;

  } catch (err) {
    alert("Error: " + err.message);
  }
}

/* ================= SAVE CARD ================= */
async function saveCardAndBook() {
  await bookNow();
}

</script>

<style>
#calendar {
  margin-top: 20px;
}
</style>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="booking.html" class="active">Booking</a>
  </nav>

  <a class="back-btn" href="index.html">⬅ Back</a>
</header>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<!-- CALENDAR -->
<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<!-- FORM -->
<form id="bookingForm">

  <select id="timeSlot" class="input" required></select>

  <input id="name" class="input" placeholder="Full Name" required>
  <input id="phone" class="input" placeholder="Phone" required>
  <input id="email" class="input" type="email" placeholder="Email" required>
  <input id="address" class="input" placeholder="Address" required>

  <select id="service" class="input" required>
    <option value="">Select Service</option>
    <option value="Home Cleaning">Home Cleaning - $120</option>
    <option value="Deep Cleaning">Deep Cleaning - $200</option>
    <option value="Office Cleaning">Office Cleaning - $150</option>
    <option value="Move In/Out Cleaning">Move In/Out Cleaning - $180</option>
  </select>

  <button type="button" class="btn" onclick="bookNow()">
    📩 Book Now
  </button>

  <button type="button" class="btn" onclick="saveCardAndBook()">
    💳 Save Card & Pay Later
  </button>

</form>

</section>

</main>

</body>
</html>
