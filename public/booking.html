<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="./css/booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>

  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="booking.html">📅 Booking</a>
  </div>
</header>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<select id="service" class="input">
  <option value="">Select Service</option>
  <option value="Home Cleaning">Home Cleaning</option>
  <option value="Deep Cleaning">Deep Cleaning</option>
  <option value="Office Cleaning">Office Cleaning</option>
  <option value="Move In/Out Cleaning">Move In/Out Cleaning</option>
</select>

<select id="timeSlot" class="input">
  <option value="">Select Time Slot</option>
  <option value="08:00-10:00">08:00-10:00</option>
  <option value="10:00-12:00">10:00-12:00</option>
  <option value="12:00-14:00">12:00-14:00</option>
  <option value="14:00-16:00">14:00-16:00</option>
  <option value="16:00-18:00">16:00-18:00</option>
</select>

<input id="name" class="input" placeholder="Full Name">
<input id="phone" class="input" placeholder="Phone">
<input id="email" class="input" placeholder="Email">
<input id="address" class="input" placeholder="Address">

<button class="btn primary" onclick="handlePayNow()">💳 Pay Now</button>
<button class="btn" onclick="bookNow('pay_later')">📌 Pay Later</button>

</section>

</main>

<script>

/* ================= API ================= */
const API = "https://dmv-cleaning-backend.onrender.com/api";

/* ================= GLOBAL ================= */
let selectedDate = null;
let isBooking = false;

/* ================= CALENDAR ================= */
document.addEventListener("DOMContentLoaded", function () {

  const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {

    initialView: "dayGridMonth",

    dateClick: function(info) {
      selectedDate = info.dateStr;
      document.getElementById("selectedDate").innerText =
        "Selected Date: " + selectedDate;
    }
  });

  calendar.render();
});

/* ================= FORM DATA ================= */
function getFormData() {
  return {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    service: document.getElementById("service").value
  };
}

/* ================= VALIDATION ================= */
function validate(data) {
  if (!selectedDate) {
    alert("Select date first");
    return false;
  }

  if (!data.name || !data.email || !data.timeSlot || !data.service) {
    alert("Please fill all required fields");
    return false;
  }

  return true;
}

/* ================= PAY LATER ================= */
async function bookNow(paymentType = "pay_later") {

  if (isBooking) return;
  isBooking = true;

  const data = getFormData();

  if (!validate(data)) {
    isBooking = false;
    return;
  }

  try {

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...data, paymentType })
    });

    const result = await res.json();

    if (!res.ok || !result.success) {
      alert(result.error || "Booking failed");
      isBooking = false;
      return;
    }

    if (result.bookingId) {
      window.location.href =
        `/success.html?bookingId=${result.bookingId}`;
    }

  } catch (err) {
    alert("Error: " + err.message);
    isBooking = false;
  }
}

/* ================= PAY NOW (STRIPE) ================= */
async function handlePayNow() {

  const data = getFormData();

  if (!validate(data)) return;

  try {

    const res = await fetch(API + "/create-checkout-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bookingData: data })
    });

    const result = await res.json();

    if (!res.ok || !result.url) {
      alert(result.error || "Payment failed");
      return;
    }

    window.location.href = result.url;

  } catch (err) {
    alert("Payment Error: " + err.message);
  }
}

</script>

</body>
</html>
