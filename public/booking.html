```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="./css/booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

<script defer>

const API = "https://dmv-cleaning-backend.onrender.com/api";

let selectedDate = null;
let bookings = [];
let calendar;

/* ================= LOAD BOOKINGS ================= */
async function loadBookings() {
  try {
    const res = await fetch(API + "/public-bookings");

    if (!res.ok) {
      console.error("API FAILED:", await res.text());
      bookings = [];
      return;
    }

    bookings = await res.json();

  } catch (err) {
    console.error("LOAD ERROR:", err);
    bookings = [];
  }
}

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", async function () {

  await loadBookings();

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {

    initialView: "dayGridMonth",
    height: 500,

    events: function(fetchInfo, successCallback) {

      const grouped = {};

      bookings.forEach(b => {
        if (!b.date) return;
        grouped[b.date] = (grouped[b.date] || 0) + 1;
      });

      const events = Object.keys(grouped).map(date => ({
        title: grouped[date] + " Booked",
        start: date,
        color: "#ef4444"
      }));

      successCallback(events);
    },

    dateClick: function(info) {
      selectedDate = info.dateStr;
      document.getElementById("selectedDate").innerText =
        "Selected Date: " + selectedDate;
    }
  });

  calendar.render();
});

/* ================= SERVICE PRICES ================= */
const servicePrices = {
  "Home Cleaning": 120,
  "Deep Cleaning": 200,
  "Office Cleaning": 150,
  "Move In/Out Cleaning": 180
};

/* ================= BOOK SYSTEM (FIXED) ================= */
async function bookNow(paymentType) {

  if (!selectedDate) {
    alert("Please select a date");
    return;
  }

  const service = document.getElementById("service").value;
  const total = servicePrices[service] || 0;

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    service,
    total,
    paymentType
  };

  if (!data.name || !data.email || !data.timeSlot || !service) {
    return alert("Please fill all required fields");
  }

  try {

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (!res.ok) {
      return alert(result.error || "Booking failed");
    }

    /* 🔥 PAY NOW FLOW (STRIPE AFTER BOOKING) */
    if (paymentType === "pay_now") {

      const stripeRes = await fetch(API + "/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service,
          total,
          customer: {
            name: data.name,
            email: data.email
          }
        })
      });

      const stripeData = await stripeRes.json();

      if (!stripeRes.ok) {
        return alert(stripeData.error || "Stripe failed");
      }

      window.location.href = stripeData.url;

    } else {
      alert("Booking saved (Pay Later selected) ✅");
    }

  } catch (err) {
    console.error(err);
    alert("Error: " + err.message);
  }
}

</script>
</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>
</header>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<select id="service" class="input">
  <option value="">Select Service</option>
  <option value="Home Cleaning">Home Cleaning - $120</option>
  <option value="Deep Cleaning">Deep Cleaning - $200</option>
  <option value="Office Cleaning">Office Cleaning - $150</option>
  <option value="Move In/Out Cleaning">Move In/Out - $180</option>
</select>

<select id="timeSlot" class="input">
  <option value="08:00-10:00">08:00-10:00</option>
  <option value="10:00-12:00">10:00-12:00</option>
  <option value="12:00-14:00">12:00-14:00</option>
  <option value="14:00-16:00">14:00-16:00</option>
  <option value="16:00-18:00">16:00-18:00</option>
</select>

<input id="name" class="input" placeholder="Full Name">
<input id="phone" class="input" placeholder="Phone">
<input id="email" class="input" placeholder="Email">
<input id="address" class="input" placeholder="Address">

<!-- ✅ FIXED BUTTONS -->
<button class="btn primary" onclick="bookNow('pay_now')">
💳 Pay Now (Stripe)
</button>

<button class="btn" onclick="bookNow('pay_later')">
📌 Pay Later
</button>

</section>

</main>

</body>
</html>
