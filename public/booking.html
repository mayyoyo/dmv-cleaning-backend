<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="./css/booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

<!-- ✅ GLOBAL CONFIG -->
<script src="config.js"></script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>

  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="booking.html">📅 Booking</a>
  </div>
</header>

<!-- POPUP -->
<div id="emailPopup" class="popup hidden">
  <div class="popup-box">
    <h2>📧 Processing...</h2>
    <p>Please wait...</p>
  </div>
</div>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<!-- ✅ UPDATED SERVICE DROPDOWN -->
<select id="service" class="input">
  <option value="">Select Service</option>

  <option value="Home Cleaning">
    🏠 Home Cleaning - Starting at $120
  </option>

  <option value="Office Cleaning">
    🏢 Office Cleaning - Starting at $150
  </option>

  <option value="Deep Cleaning">
    🧽 Deep Cleaning - Starting at $200
  </option>

  <option value="Move In/Out Cleaning">
    🚚 Move In/Out Cleaning - Starting at $250
  </option>
</select>

<!-- TIME -->
<select id="timeSlot" class="input">
  <option value="08:00-10:00">08:00-10:00</option>
  <option value="10:00-12:00">10:00-12:00</option>
  <option value="12:00-14:00">12:00-14:00</option>
  <option value="14:00-16:00">14:00-16:00</option>
  <option value="16:00-18:00">16:00-18:00</option>
</select>

<input id="name" class="input" placeholder="Full Name">
<input id="phone" class="input" placeholder="Phone">
<input id="email" class="input" placeholder="Email">
<input id="address" class="input" placeholder="Address">

<button class="btn primary" onclick="handlePayNow()">💳 Pay Now (Deposit)</button>
<button class="btn" onclick="handlePayLater()">📌 Pay Later</button>

</section>

</main>

<script>

const API = window.API;

/* ================= STATE ================= */
let selectedDate = null;
let bookings = [];

/* ================= PRICE FUNCTION ================= */
function getServicePrice(service) {
  if (!service) return 120;

  if (service === "Home Cleaning") return 120;
  if (service === "Office Cleaning") return 150;
  if (service === "Deep Cleaning") return 200;
  if (service === "Move In/Out Cleaning") return 250;

  return 120;
}

/* ================= POPUP ================= */
function showPopup() {
  document.getElementById("emailPopup").classList.remove("hidden");
}

function hidePopup() {
  document.getElementById("emailPopup").classList.add("hidden");
}

/* ================= LOAD BOOKINGS ================= */
async function loadBookings() {
  try {
    const res = await fetch(API + "/bookings");
    bookings = await res.json();
  } catch (err) {
    bookings = [];
  }
}

/* ================= CALENDAR ================= */
document.addEventListener("DOMContentLoaded", async () => {

  await loadBookings();

  const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    height: 450,

    dateClick(info) {
      selectedDate = info.dateStr;
      document.getElementById("selectedDate").innerText =
        "Selected: " + selectedDate;
    }
  });

  calendar.render();
});

/* ================= PAY NOW ================= */
async function handlePayNow() {

  const service = document.getElementById("service").value;
  const email = document.getElementById("email").value;

  if (!service || !email || !selectedDate) {
    return alert("Please select service, email, and date");
  }

  const price = getServicePrice(service);

  showPopup();

  const res = await fetch(API + "/create-deposit-checkout", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ service, price, email })
  });

  const data = await res.json();

  hidePopup();

  if (data.url) {
    window.location.href = data.url;
  } else {
    alert("Stripe error");
  }
}

/* ================= PAY LATER ================= */
async function handlePayLater() {

  const service = document.getElementById("service").value;

  if (!service || !selectedDate) {
    return alert("Fill required fields");
  }

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    service,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    price: getServicePrice(service),
    deposit: Math.round(getServicePrice(service) * 0.25),
    paymentType: "later"
  };

  showPopup();

  const res = await fetch(API + "/book", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  hidePopup();

  if (result.success) {
    window.location.href = `/success.html?bookingId=${result.bookingId}`;
  } else {
    alert("Booking failed");
  }
}

</script>

</body>
</html>
