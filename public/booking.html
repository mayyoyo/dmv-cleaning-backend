<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Confirmed</title>

<link rel="stylesheet" href="css/success.css">
</head>

<body>

<script>
/* ================= FIXED API (IMPORTANT) ================= */
const API = "https://dmv-cleaning-backend.onrender.com";

/* ================= GET BOOKING ID ================= */
const params = new URLSearchParams(window.location.search);
const bookingId = params.get("bookingId");

if (!bookingId) {
  document.body.innerHTML = "<h2>❌ Missing Booking ID</h2>";
}

/* ================= SAFE LOAD FUNCTION ================= */
async function loadBooking() {
  try {

    const res = await fetch(`${API}/api/booking/${bookingId}`);

    if (!res.ok) {
      throw new Error("Server error");
    }

    const booking = await res.json();

    if (!booking || booking.error) {
      document.body.innerHTML = "<h2>❌ Booking not found</h2>";
      return;
    }

    /* ================= FILL DATA ================= */
    document.getElementById("bookingId").innerText = booking._id;
    document.getElementById("status").innerText = booking.paymentStatus || "pending";

    document.getElementById("name").innerText = booking.name || "";
    document.getElementById("email").innerText = booking.email || "";
    document.getElementById("phone").innerText = booking.phone || "";

    document.getElementById("service").innerText = booking.service || "";
    document.getElementById("date").innerText = booking.date || "";
    document.getElementById("time").innerText = booking.timeSlot || "";
    document.getElementById("total").innerText = booking.price || 0;

    /* ================= INVOICE LINK ================= */
    const invoiceLink = `${API}/api/invoice/${booking._id}`;

    document.getElementById("download").href = invoiceLink;
    document.getElementById("download2").href = invoiceLink;

  } catch (err) {
    console.log("LOAD ERROR:", err);
    document.body.innerHTML = "<h2>⚠ Error loading booking</h2>";
  }
}

/* ================= RUN ================= */
loadBooking();
</script>

<h1>Booking Confirmed 🎉</h1>

<a id="download" class="btn">📄 Download Invoice</a>

<div class="wrapper">

  <div class="success-header">
    <div class="checkmark">✔</div>
    <h1>Booking Confirmed</h1>
    <p>Thank you for choosing DMV Cleaning Services</p>
  </div>

  <div class="card">

    <div class="top">
      <h2>🧼 DMV Cleaning Services LLC</h2>
      <p>📞 703-967-0674</p>
    </div>

    <div class="details">

      <div class="row"><span>Booking ID</span><b id="bookingId"></b></div>
      <div class="row"><span>Status</span><b id="status"></b></div>

      <div class="divider"></div>

      <div class="row"><span>Name</span><b id="name"></b></div>
      <div class="row"><span>Email</span><b id="email"></b></div>
      <div class="row"><span>Phone</span><b id="phone"></b></div>

      <div class="divider"></div>

      <div class="row"><span>Service</span><b id="service"></b></div>
      <div class="row"><span>Date</span><b id="date"></b></div>
      <div class="row"><span>Time</span><b id="time"></b></div>

    </div>

    <div class="price-box">
      <p>Total</p>
      <h2>$<span id="total">0</span></h2>
    </div>

    <div style="margin:15px 0;">
      <a id="download2" class="btn">📄 Download Invoice</a>
    </div>

  </div>
</div>

</body>
</html>
