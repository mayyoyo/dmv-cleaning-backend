<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="css/booking.css">

<!-- FULLCALENDAR CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

const API = "https://dmv-cleaning-backend.onrender.com";
const socket = io(API);

let bookings = [];
let selectedDate = null;
let calendar;

/* ================= LOAD BOOKINGS ================= */
async function loadBookings() {
  const res = await fetch(API + "/api/public-bookings");
  bookings = await res.json();
  updateSlots();
  updateCalendar();
}

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", async function () {

  await loadBookings();

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {

    initialView: "dayGridMonth",
    height: 500,

    events: [],

    dateClick: function(info) {

      selectedDate = info.dateStr;

      document.getElementById("selectedDate").innerText =
        "Selected: " + selectedDate;

      updateSlots();
    },

    eventDidMount: function(info) {
      info.el.style.backgroundColor = "#111";
      info.el.style.color = "white";
    }
  });

  calendar.render();

  /* SOCKET */
  socket.on("new-booking", (b) => {
    bookings.unshift(b);
    updateSlots();
    updateCalendar();
  });

  socket.on("update-slots", (data) => {
    bookings = data;
    updateSlots();
    updateCalendar();
  });

});

/* ================= CALENDAR UPDATE ================= */
function updateCalendar() {
  if (!calendar) return;

  const grouped = {};

  bookings.forEach(b => {
    grouped[b.date] = (grouped[b.date] || 0) + 1;
  });

  const events = Object.keys(grouped).map(date => ({
    title: grouped[date] + " Bookings",
    start: date,
    color: grouped[date] >= 5 ? "#ff4d4d" : "#333"
  }));

  calendar.removeAllEvents();
  calendar.addEventSource(events);
}

/* ================= UPDATE SLOTS ================= */
function updateSlots() {

  const select = document.getElementById("timeSlot");

  if (!selectedDate) {
    select.innerHTML = `<option disabled selected>📅 Click a date above</option>`;
    return;
  }

  const slots = [
    "08:00-10:00",
    "10:00-12:00",
    "12:00-14:00",
    "14:00-16:00",
    "16:00-18:00"
  ];

  select.innerHTML = `<option value="">Select Time</option>`;

  const booked = bookings
    .filter(b => b.date === selectedDate)
    .map(b => b.timeSlot);

  let firstAvailable = null;

  slots.forEach(slot => {

    const option = document.createElement("option");
    option.value = slot;

    if (booked.includes(slot)) {
      option.textContent = slot + " ❌ Booked";
      option.disabled = true;
    } else {
      option.textContent = slot + " ✅ Available";

      if (!firstAvailable) firstAvailable = slot;
    }

    select.appendChild(option);
  });

  setTimeout(() => {
    if (firstAvailable) select.value = firstAvailable;
  }, 100);
}

/* ================= BOOK ================= */
async function bookNow() {

  const timeSlot = document.getElementById("timeSlot").value;

  if (!selectedDate) return alert("Please select a date");
  if (!timeSlot) return alert("Please select a time slot");

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot,
    service: document.getElementById("service").value
  };

  const res = await fetch(API + "/api/book", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (!res.ok) return alert(result.error || "Booking failed");

  window.location.href = "/payment.html?bookingId=" + result.bookingId;
}

</script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>
</header>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<form onsubmit="event.preventDefault(); bookNow();">

<select id="timeSlot" class="input"></select>

<input id="name" placeholder="Full Name" class="input" required>
<input id="phone" placeholder="Phone" class="input" required>
<input id="email" placeholder="Email" class="input" required>
<input id="address" placeholder="Address" class="input" required>

<select id="service" class="input" required>
  <option value="">Select Service</option>
  <option>Home Cleaning</option>
  <option>Deep Cleaning</option>
  <option>Office Cleaning</option>
  <option>Move In/Out Cleaning</option>
</select>

<button type="submit" class="btn">Book Now</button>

</form>

</section>

</main>

</body>
</html>
