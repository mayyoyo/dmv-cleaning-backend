<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="css/booking.css">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="booking.html" class="active">Booking</a>
  </nav>

  <a class="back-btn" href="index.html">⬅ Back</a>
</header>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<!-- CALENDAR -->
<div id="calendar"></div>

<!-- SELECTED DATE -->
<p id="selectedDate">No date selected</p>

<!-- FORM -->
<form id="bookingForm" onsubmit="return false;">

  <select id="timeSlot" class="input" required>
    <option value="">Select Time</option>
    <option value="08:00-10:00">08:00 - 10:00</option>
    <option value="10:00-12:00">10:00 - 12:00</option>
    <option value="12:00-14:00">12:00 - 14:00</option>
    <option value="14:00-16:00">14:00 - 16:00</option>
    <option value="16:00-18:00">16:00 - 18:00</option>
  </select>

  <input id="name" class="input" placeholder="Full Name" required>
  <input id="phone" class="input" placeholder="Phone" required>
  <input id="email" class="input" type="email" placeholder="Email" required>
  <input id="address" class="input" placeholder="Address" required>

  <select id="service" class="input" required>
    <option value="">Select Service</option>
    <option value="Home Cleaning">Home Cleaning - $120</option>
    <option value="Deep Cleaning">Deep Cleaning - $200</option>
    <option value="Office Cleaning">Office Cleaning - $150</option>
    <option value="Move In/Out Cleaning">Move In/Out Cleaning - $180</option>
  </select>

  <button type="button" class="btn primary" onclick="bookNow()">
    📩 Book Now
  </button>

</form>

</section>

</main>

<script>
const API = "https://dmv-cleaning-backend.onrender.com/api";

let selectedDate = null;

/* ================= CALENDAR ================= */
document.addEventListener("DOMContentLoaded", function () {

  const calendarEl = document.getElementById("calendar");

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    height: 500,

    dateClick: function(info) {
      selectedDate = info.dateStr;
      document.getElementById("selectedDate").innerText =
        "Selected: " + selectedDate;
    }
  });

  calendar.render();
});

/* ================= BOOK NOW ================= */
async function bookNow() {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const timeSlot = document.getElementById("timeSlot").value;
  const service = document.getElementById("service").value;

  if (!selectedDate) {
    return alert("❌ Please select a date");
  }

  if (!name || !email || !phone || !address || !timeSlot || !service) {
    return alert("❌ Please fill all fields");
  }

  try {

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        email,
        phone,
        address,
        date: selectedDate,
        timeSlot,
        service
      })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(data.error || "Booking failed");
    }

    // ✅ SUCCESS MESSAGE (clean UX)
    alert("Booking confirmed successfully!");

    // ✅ FIXED REDIRECT (IMPORTANT)
    window.location.href = "/success.html?bookingId=" + data.bookingId;

  } catch (err) {
    console.error("BOOK ERROR:", err);
    alert("Server error");
  }
}
</script>

</body>
</html>
