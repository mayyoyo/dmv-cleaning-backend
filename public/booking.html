<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="./css/booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>

  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="booking.html">📅 Booking</a>
  </div>
</header>

<!-- POPUP -->
<div id="emailPopup" class="popup hidden">
  <div class="popup-box">
    <h2>📧 Processing...</h2>
    <p>Please wait while we confirm your booking</p>
  </div>
</div>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<select id="service" class="input">
  <option value="">Select Service</option>
  <option value="Home Cleaning">Home Cleaning</option>
  <option value="Deep Cleaning">Deep Cleaning</option>
  <option value="Office Cleaning">Office Cleaning</option>
  <option value="Move In/Out Cleaning">Move In/Out Cleaning</option>
</select>

<select id="timeSlot" class="input">
  <option value="08:00-10:00">08:00-10:00</option>
  <option value="10:00-12:00">10:00-12:00</option>
  <option value="12:00-14:00">12:00-14:00</option>
  <option value="14:00-16:00">14:00-16:00</option>
  <option value="16:00-18:00">16:00-18:00</option>
</select>

<input id="name" class="input" placeholder="Full Name">
<input id="phone" class="input" placeholder="Phone">
<input id="email" class="input" placeholder="Email">
<input id="address" class="input" placeholder="Address">

<button class="btn primary" onclick="handlePayNow()">💳 Pay Now</button>
<button class="btn" onclick="handlePayLater()">📌 Pay Later</button>

</section>

</main>

<script>
/* ================= API ================= */
const API = "https://dmv-cleaning-backend.onrender.com/api";

/* ================= GLOBAL ================= */
let selectedDate = null;
let bookings = [];
let calendar;
let isBooking = false;

const MAX_PER_SLOT = 3;

/* ================= POPUP ================= */
function showPopup() {
  document.getElementById("emailPopup").classList.remove("hidden");
}

function hidePopup() {
  document.getElementById("emailPopup").classList.add("hidden");
}

/* ================= LOAD BOOKINGS ================= */
async function loadBookings() {
  try {
    const res = await fetch(API + "/public-bookings");
    bookings = await res.json();
  } catch (err) {
    console.error("LOAD ERROR:", err);
    bookings = [];
  }
}

/* ================= SLOT CHECK ================= */
function isSlotFull(date, timeSlot) {
  return bookings.filter(b =>
    b.date === date && b.timeSlot === timeSlot
  ).length >= MAX_PER_SLOT;
}

/* ================= UPDATE SLOTS ================= */
function updateTimeSlots() {
  const select = document.getElementById("timeSlot");

  Array.from(select.options).forEach(opt => {

    if (!selectedDate) return;

    const count = bookings.filter(b =>
      b.date === selectedDate && b.timeSlot === opt.value
    ).length;

    const remaining = MAX_PER_SLOT - count;

    if (remaining <= 0) {
      opt.disabled = true;
      opt.text = opt.value + " (FULL)";
    } else {
      opt.disabled = false;
      opt.text = `${opt.value} (${remaining}/${MAX_PER_SLOT})`;
    }
  });
}

/* ================= INIT CALENDAR ================= */
document.addEventListener("DOMContentLoaded", async () => {

  await loadBookings();
  updateTimeSlots();

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {

    initialView: "dayGridMonth",
    height: 500,

    events(fetchInfo, successCallback) {

      const grouped = {};

      bookings.forEach(b => {
        if (!grouped[b.date]) grouped[b.date] = {};
        if (!grouped[b.date][b.timeSlot]) grouped[b.date][b.timeSlot] = 0;
        grouped[b.date][b.timeSlot]++;
      });

      const events = Object.keys(grouped).map(date => {

        let full = 0;
        let total = Object.keys(grouped[date]).length;

        Object.values(grouped[date]).forEach(count => {
          if (count >= MAX_PER_SLOT) full++;
        });

        return {
          title: `${full}/${total || 1} full`,
          start: date,
          color: full === total ? "red" : "green"
        };
      });

      successCallback(events);
    },

    dateClick(info) {
      selectedDate = info.dateStr;

      document.getElementById("selectedDate").innerText =
        "Selected Date: " + selectedDate;

      updateTimeSlots();
    }
  });

  calendar.render();
});

/* ================= COLLECT DATA ================= */
function collectFormData() {
  return {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    service: document.getElementById("service").value,
    total: 120
  };
}

/* ================= PAY NOW ================= */
async function handlePayNow() {

  if (isBooking) return;
  isBooking = true;

  try {

    if (!selectedDate) {
      alert("Select date first");
      isBooking = false;
      return;
    }

    const data = collectFormData();

    if (isSlotFull(data.date, data.timeSlot)) {
      alert("❌ Slot full");
      isBooking = false;
      return;
    }

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: data.name,
        email: data.email,
        phone: data.phone,
        address: data.address,
        date: data.date,
        timeSlot: data.timeSlot,
        service: data.service,
        price: data.total,
        paymentType: "online"
      })
    });

    const result = await res.json();

    console.log("SERVER RESPONSE:", result);

    if (result.success) {
      window.location.href =
        `/success.html?bookingId=${result.bookingId}`;
    } else {
      alert("❌ Booking failed");
    }

  } catch (err) {
    console.error(err);
    alert("Server error");
  }

  isBooking = false;
}

/* ================= PAY LATER ================= */
async function handlePayLater() {

  if (isBooking) return;
  isBooking = true;

  try {

    if (!selectedDate) {
      alert("Select date first");
      isBooking = false;
      return;
    }

    const data = collectFormData();

    if (isSlotFull(data.date, data.timeSlot)) {
      alert("❌ Slot full");
      isBooking = false;
      return;
    }

    showPopup();

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: data.name,
        email: data.email,
        phone: data.phone,
        address: data.address,
        date: data.date,
        timeSlot: data.timeSlot,
        service: data.service,
        price: data.total,
        paymentType: "later"
      })
    });

    const result = await res.json();

    hidePopup();

    console.log("SERVER RESPONSE:", result);

    if (result.success) {

      await loadBookings();
      updateTimeSlots();
      calendar.refetchEvents();

      window.location.href =
        `/success.html?bookingId=${result.bookingId}`;

    } else {
      alert("❌ Booking failed");
    }

  } catch (err) {
    hidePopup();
    console.error(err);
    alert("Server error");
  }

  isBooking = false;
}
</script>

</body>
</html>
