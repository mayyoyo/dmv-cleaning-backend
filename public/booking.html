<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="css/booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

<script defer>

const API = "https://dmv-cleaning-backend.onrender.com/api";

let selectedDate = null;
let bookings = [];
let calendar;

/* LOAD BOOKINGS */
async function loadBookings() {
  try {
    const res = await fetch(API + "/public-bookings");
    const data = await res.json();
    bookings = Array.isArray(data) ? data : [];

    if (calendar) calendar.refetchEvents();

  } catch (err) {
    console.error(err);
    bookings = [];
  }
}

/* INIT */
document.addEventListener("DOMContentLoaded", async () => {

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    height: 500,

    events: function(fetchInfo, successCallback) {

      const grouped = {};

      bookings.forEach(b => {
        if (!b.date) return;
        grouped[b.date] = (grouped[b.date] || 0) + 1;
      });

      const events = Object.keys(grouped).map(date => ({
        title: grouped[date] + " Booked",
        start: date
      }));

      successCallback(events);
    },

    dateClick: function(info) {
      selectedDate = info.dateStr;
      document.getElementById("selectedDate").innerText =
        "Selected Date: " + selectedDate;
      updateSlots();
    }
  });

  calendar.render();
  await loadBookings();
});

/* SLOTS */
function updateSlots() {

  const select = document.getElementById("timeSlot");

  if (!selectedDate) {
    select.innerHTML = `<option disabled selected>Select a date</option>`;
    return;
  }

  const slots = [
    "08:00-10:00",
    "10:00-12:00",
    "12:00-14:00",
    "14:00-16:00",
    "16:00-18:00"
  ];

  select.innerHTML = `<option value="">Select Time</option>`;

  const booked = bookings
    .filter(b => b.date === selectedDate)
    .map(b => b.timeSlot);

  slots.forEach(slot => {
    const opt = document.createElement("option");

    if (booked.includes(slot)) {
      opt.textContent = slot + " ❌";
      opt.disabled = true;
    } else {
      opt.textContent = slot + " ✅";
      opt.value = slot;
    }

    select.appendChild(opt);
  });
}

/* BOOK */
async function bookNow() {

  if (!selectedDate) {
    alert("Select a date");
    return;
  }

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    service: document.getElementById("service").value
  };

  try {

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (!res.ok) {
      return alert(result.error || "Booking failed");
    }

    alert("Booking success ✅");

    window.location.href =
      "/payment.html?bookingId=" + result.bookingId;

  } catch (err) {
    alert("Server error");
  }
}

</script>
</head>

<body>

<h2>📅 Book Cleaning</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<select id="timeSlot"></select>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">

<select id="service">
  <option value="">Service</option>
  <option value="Home Cleaning">Home Cleaning</option>
  <option value="Deep Cleaning">Deep Cleaning</option>
</select>

<button onclick="bookNow()">Book Now</button>

</body>
</html>
