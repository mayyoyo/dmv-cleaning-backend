<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="./css/booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

<script src="config.js"></script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>
  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="booking.html">📅 Booking</a>
  </div>
</header>

<!-- POPUP -->

<div id="emailPopup" class="popup hidden">
  <div class="popup-box">
    <h2>📧 Processing...</h2>
    <p>Please wait...</p>
  </div>
</div>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<select id="service" class="input">
  <option value="">Select Service</option>
  <option value="Home Cleaning - $120">🏠 Home Cleaning - Starting at $120</option>
  <option value="Office Cleaning - $150">🏢 Office Cleaning - Starting at $150</option>
  <option value="Deep Cleaning - $200">🧽 Deep Cleaning - Starting at $200</option>
  <option value="Move In/Out Cleaning - $250">🚚 Move In/Out Cleaning - Starting at $250</option>
</select>

<select id="timeSlot" class="input">
  <option value="08:00-10:00">08:00-10:00</option>
  <option value="10:00-12:00">10:00-12:00</option>
  <option value="12:00-14:00">12:00-14:00</option>
  <option value="14:00-16:00">14:00-16:00</option>
  <option value="16:00-18:00">16:00-18:00</option>
</select>

<input id="name" class="input" placeholder="Full Name">
<input id="phone" class="input" placeholder="Phone">
<input id="email" class="input" placeholder="Email">
<input id="address" class="input" placeholder="Address">

<button class="btn primary" onclick="handlePayNow()">💳 Pay Now (Deposit)</button>
<button class="btn" onclick="handlePayLater()">📌 Pay Later</button>

</section>

</main>

<script>

const API = window.API;

/* ================= STATE ================= */
let selectedDate = null;

/* ================= PRICE ================= */
function getServicePrice(service) {
  if (!service) return 120;
  if (service.includes("$120")) return 120;
  if (service.includes("$150")) return 150;
  if (service.includes("$200")) return 200;
  if (service.includes("$250")) return 250;
  return 120;
}

/* ================= POPUP ================= */
function showPopup() {
  document.getElementById("emailPopup").classList.remove("hidden");
}

function hidePopup() {
  document.getElementById("emailPopup").classList.add("hidden");
}

/* ================= CALENDAR ================= */
document.addEventListener("DOMContentLoaded", () => {

  const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    height: 450,

    dateClick(info) {
      selectedDate = info.dateStr;
      document.getElementById("selectedDate").innerText =
        "Selected: " + selectedDate;
    }
  });

  calendar.render();
});

/* ================= PAY NOW (FIXED STRIPE REQUEST) ================= */
async function handlePayNow() {

  console.log("PAY BUTTON CLICKED");

  const service = document.getElementById("service").value;
  const email = document.getElementById("email").value;
  const timeSlot = document.getElementById("timeSlot").value;

  if (!service || !email || !selectedDate) {
    alert("Please select service, email, and date");
    return;
  }

  const price = getServicePrice(service);

  showPopup();

  try {
    const res = await fetch(API + "/create-deposit-checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },

      // ✅ FIXED EXACT FORMAT (THIS IS THE IMPORTANT PART)
      body: JSON.stringify({
        service,
        email,
        price
      })
    });

    const data = await res.json();

    hidePopup();

    console.log("STRIPE RESPONSE:", data);

    if (data.url) {
      window.location.href = data.url;
    } else {
      alert("Stripe failed");
    }

  } catch (err) {
    hidePopup();
    console.error(err);
    alert("Network error");
  }
}

/* ================= PAY LATER ================= */
async function handlePayLater() {

  const service = document.getElementById("service").value;

  if (!service || !selectedDate) {
    alert("Fill required fields");
    return;
  }

  const price = getServicePrice(service);

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    service,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    price,
    deposit: Math.round(price * 0.25),
    paymentType: "later"
  };

  showPopup();

  const res = await fetch(API + "/book", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  hidePopup();

  if (result.success) {
    window.location.href =
      "https://mydmvcleaningservice.com/success.html?bookingId=" + result.bookingId;
  } else {
    alert("Booking failed");
  }
}

</script>

</body>
</html>
