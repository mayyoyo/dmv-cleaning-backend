<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="css/booking.css">

<!-- FULLCALENDAR -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>

<script defer>

const API = "https://YOUR-RENDER-URL.onrender.com/api";

let selectedDate = null;
let bookings = [];
let calendar;

/* ================= LOAD BOOKINGS ================= */
async function loadBookings() {
  try {
    const res = await fetch(API + "/public-bookings");
    bookings = await res.json();

    console.log("BOOKINGS:", bookings);

    if (calendar) calendar.refetchEvents();

  } catch (err) {
    console.error("LOAD ERROR:", err);
  }
}

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", async function () {

  const calendarEl = document.getElementById("calendar");

  if (!calendarEl) {
    console.error("Calendar not found");
    return;
  }

  calendar = new FullCalendar.Calendar(calendarEl, {

    initialView: "dayGridMonth",
    height: 500,

    /* ================= SHOW BOOKED DAYS ================= */
    events: function(fetchInfo, successCallback) {

      const grouped = {};

      bookings.forEach(b => {
        grouped[b.date] = (grouped[b.date] || 0) + 1;
      });

      const events = Object.keys(grouped).map(date => ({
        title: grouped[date] + " Booked",
        start: date,
        color: grouped[date] >= 5 ? "red" : "#333"
      }));

      successCallback(events);
    },

    /* ================= FIXED DATE CLICK ================= */
    dateClick: function(info) {

      console.log("DATE CLICKED:", info.dateStr);

      selectedDate = info.dateStr;

      const dateBox = document.getElementById("selectedDate");

      if (dateBox) {
        dateBox.innerText = "Selected Date: " + selectedDate;
      }

      updateSlots();
    }
  });

  calendar.render();

  await loadBookings();
});

/* ================= SLOTS ================= */
function updateSlots() {

  const select = document.getElementById("timeSlot");
  if (!select) return;

  /* 🔴 FIX: THIS IS YOUR MAIN BUG FIX */
  if (!selectedDate) {
    select.innerHTML = `<option disabled selected>📅 Click a date above</option>`;

    const dateBox = document.getElementById("selectedDate");
    if (dateBox) dateBox.innerText = "No date selected";

    return;
  }

  const slots = [
    "08:00-10:00",
    "10:00-12:00",
    "12:00-14:00",
    "14:00-16:00",
    "16:00-18:00"
  ];

  select.innerHTML = `<option value="">Select Time</option>`;

  const booked = bookings
    .filter(b => b.date === selectedDate)
    .map(b => b.timeSlot);

  let firstAvailable = null;

  slots.forEach(slot => {

    const option = document.createElement("option");
    option.value = slot;

    if (booked.includes(slot)) {
      option.textContent = slot + " ❌ Booked";
      option.disabled = true;
    } else {
      option.textContent = slot + " ✅ Available";

      if (!firstAvailable) firstAvailable = slot;
    }

    select.appendChild(option);
  });

  /* AUTO SELECT FIRST AVAILABLE SLOT */
  setTimeout(() => {
    if (firstAvailable) {
      select.value = firstAvailable;
    }
  }, 100);
}

/* ================= BOOK ================= */
async function bookNow() {

  if (!selectedDate) {
    alert("Please select a date");
    return;
  }

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    date: selectedDate,
    timeSlot: document.getElementById("timeSlot").value,
    service: document.getElementById("service").value
  };

  try {

    const res = await fetch(API + "/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (!res.ok) {
      return alert(result.error || "Booking failed");
    }

    alert("Booking Confirmed ✅");

    window.location.href = "/payment.html?bookingId=" + result.bookingId;

  } catch (err) {
    console.error(err);
    alert("Server error");
  }
}

</script>

</head>

<body>

<header class="navbar">
  <div class="logo">🧼 Smart Booking</div>
</header>

<main class="booking-page">

<section class="booking-card">

<h2>📅 Book Cleaning Service</h2>

<div id="calendar"></div>

<p id="selectedDate">No date selected</p>

<select id="timeSlot" class="input"></select>

<input id="name" placeholder="Full Name" class="input" required>
<input id="phone" placeholder="Phone" class="input" required>
<input id="email" placeholder="Email" class="input" required>
<input id="address" placeholder="Address" class="input" required>

<select id="service" class="input" required>
  <option value="">Select Service</option>
  <option value="Home Cleaning">Home Cleaning - $120</option>
  <option value="Deep Cleaning">Deep Cleaning - $200</option>
  <option value="Office Cleaning">Office Cleaning - $150</option>
  <option value="Move In/Out Cleaning">Move In/Out - $180</option>
</select>

<button class="btn" onclick="bookNow()">Book Now</button>

</section>

</main>

</body>
</html>
