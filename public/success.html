<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receipt - Booking Confirmed</title>

<link rel="stylesheet" href="css/success.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>

<script defer src="js/success.js"></script>

</head>

<body>

<div class="receipt-card" id="receipt">

  <h1>🧼 DMV Cleaning Services LLC</h1>
  <h2>✔ Booking Receipt</h2>

  <div>
    <b>Status:</b>
    <span id="statusBadge" class="status pending">PENDING</span>
  </div>

  <hr>

  <p><b>Name:</b> <span id="name"></span></p>
  <p><b>Email:</b> <span id="email"></span></p>
  <p><b>Service:</b> <span id="service"></span></p>
  <p><b>Date:</b> <span id="date"></span></p>
  <p><b>Time:</b> <span id="time"></span></p>
  <p><b>Total:</b> $<span id="total"></span></p>

  <hr>

  <button onclick="downloadPDF()">🧾 Download PDF</button>
  <button onclick="window.print()">🖨 Print</button>

</div>

</body>
</html>
