<!DOCTYPE html>
<html>
<head>
<title>Success</title>
</head>
<body>

<h1>Booking Success</h1>

<div id="info"></div>

<script>
const API = "https://dmv-cleaning-backend.onrender.com";
const bookingId = new URLSearchParams(location.search).get("bookingId");

async function load() {
  try {
    const res = await fetch(`${API}/api/booking/${bookingId}`);

    if (!res.ok) throw new Error("fail");

    const b = await res.json();

    info.innerHTML = `
      <p>Name: ${b.name || ""}</p>
      <p>Service: ${b.service || ""}</p>
      <p>Date: ${b.date || ""}</p>
      <p>Time: ${b.timeSlot || ""}</p>
      <p>Price: $${b.price || 0}</p>
    `;

  } catch (e) {
    info.innerHTML = "⚠ Error loading booking";
  }
}

load();
</script>

</body>
</html>
