<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking Success</title>
<link rel="stylesheet" href="css/success.css">
</head>

<body>

<div class="wrapper">

  <h1>✔ Booking Confirmed</h1>

  <div class="card">

    <p><b>Booking ID:</b> <span id="id"></span></p>
    <p><b>Name:</b> <span id="name"></span></p>
    <p><b>Service:</b> <span id="service"></span></p>
    <p><b>Date:</b> <span id="date"></span></p>
    <p><b>Time:</b> <span id="time"></span></p>
    <p><b>Total:</b> $<span id="total"></span></p>
    <p><b>Status:</b> <span id="status"></span></p>

  </div>

</div>

<script>
const API = "https://dmv-cleaning-backend.onrender.com/api";

/* ================= GET URL VALUES ================= */
const bookingId = new URLSearchParams(location.search).get("bookingId");
const sessionId = new URLSearchParams(location.search).get("session_id");

/* ================= ELEMENTS ================= */
const idEl = document.getElementById("id");
const nameEl = document.getElementById("name");
const serviceEl = document.getElementById("service");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");
const totalEl = document.getElementById("total");
const statusEl = document.getElementById("status");

/* ================= LOAD BOOKING ================= */
async function loadBooking() {

  try {

    /* ================= STRIPE FLOW (IMPORTANT FIX) ================= */
    if (sessionId) {

      const res = await fetch(API + "/verify-session?session_id=" + sessionId);
      const result = await res.json();

      const b = result.booking;

      if (!b) {
        document.body.innerHTML = "NOT FOUND";
        return;
      }

      render(b);
      return;
    }

    /* ================= NORMAL BOOKING FLOW ================= */
    const res = await fetch(API + "/public-bookings");
    const data = await res.json();

    const b = data.find(x =>
      x._id === bookingId || x.stripeSessionId === bookingId
    );

    if (!b) {
      document.body.innerHTML = "NOT FOUND";
      return;
    }

    render(b);

  } catch (err) {
    console.error(err);
    document.body.innerHTML = "ERROR LOADING BOOKING";
  }
}

/* ================= RENDER ================= */
function render(b) {

  idEl.innerText = b._id || "";
  nameEl.innerText = b.name || "";
  serviceEl.innerText = b.service || "";
  dateEl.innerText = b.date || "";
  timeEl.innerText = b.timeSlot || "";
  totalEl.innerText = b.total || 0;
  statusEl.innerText = b.paymentStatus || "pending";
}

loadBooking();
</script>

</body>
</html>
