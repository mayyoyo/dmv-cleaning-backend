<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Success</title>

<link rel="stylesheet" href="css/success.css">

</head>

<body>

<div class="success-container">

  <h1>🧼 DMV Cleaning Services LLC</h1>

  <!-- BUSINESS INFO -->
  <p><b>Business Phone:</b> 703-967-0674</p>

  <div class="card">

    <h2>✔ Booking Confirmed</h2>

    <p><b>Booking Receipt</b></p>

    <p>Status: <span id="status">Loading...</span></p>

    <hr>

    <!-- CUSTOMER INFO -->
    <p>Name: <span id="name"></span></p>
    <p>Email: <span id="email"></span></p>
    <p>Customer Phone: <span id="phone"></span></p>

    <hr>

    <!-- SERVICE INFO -->
    <p>Service: <span id="service"></span></p>
    <p>Date: <span id="date"></span></p>
    <p>Time: <span id="time"></span></p>

    <hr>

    <p>Total: $ <span id="total"></span></p>

  </div>

</div>

<script>
const API = "https://dmv-cleaning-backend.onrender.com/api";

/* ================= GET BOOKING ID ================= */
const params = new URLSearchParams(window.location.search);
const bookingId = params.get("bookingId");

console.log("Booking ID:", bookingId);

/* ================= LOAD BOOKING ================= */
async function loadBooking() {

  if (!bookingId) {
    document.body.innerHTML = "<h2>Invalid booking</h2>";
    return;
  }

  try {

    const res = await fetch(API + "/booking/" + bookingId);
    const data = await res.json();

    if (!res.ok) {
      throw new Error("Booking not found");
    }

    document.getElementById("status").innerText = data.status || "Pending";
    document.getElementById("name").innerText = data.name || "";
    document.getElementById("email").innerText = data.email || "";

    // ✅ NEW: customer phone
    document.getElementById("phone").innerText = data.phone || "";

    document.getElementById("service").innerText = data.service || "";
    document.getElementById("date").innerText = data.date || "";
    document.getElementById("time").innerText = data.timeSlot || "";

    // example pricing
    document.getElementById("total").innerText = "120";

  } catch (err) {
    console.error(err);
    document.body.innerHTML = "<h2>❌ Error loading booking</h2>";
  }
}

loadBooking();
</script>

</body>
</html>
