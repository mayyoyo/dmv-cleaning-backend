<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Confirmed - DMV Cleaning</title>

<link rel="stylesheet" href="css/success.css">

</head>

<body>

<div class="success-container">

  <div class="success-card">

    <h1>🧼 DMV Cleaning Services LLC</h1>

    <p class="business-phone">
      Business Phone: 703-967-0674
    </p>

    <h2>✔ Booking Confirmed</h2>

    <h3>Booking Receipt</h3>

    <div id="receipt">

      <p>Status: <span id="status">Pending</span></p>

      <p>Name: <span id="name"></span></p>

      <p>Email: <span id="email"></span></p>

      <p>Customer Phone: <span id="phone"></span></p>

      <p>Service: <span id="service"></span></p>

      <p>Date: <span id="date"></span></p>

      <p>Time: <span id="time"></span></p>

      <hr>

      <!-- ✅ PROFESSIONAL FIX -->
      <p class="total">
        Amount Due: $<span id="total">0</span>
      </p>

    </div>

  </div>

</div>

<script>
const API = "https://dmv-cleaning-backend.onrender.com/api";

const params = new URLSearchParams(window.location.search);
const bookingId = params.get("bookingId");
const urlTotal = params.get("total");

/* ================= SAFE FALLBACK ================= */
if (urlTotal) {
  document.getElementById("total").innerText = urlTotal;
}

/* ================= BEST PRACTICE (REAL DATA) ================= */
if (bookingId) {

  fetch(API + "/booking/" + bookingId)
    .then(res => res.json())
    .then(data => {

      document.getElementById("name").innerText = data.name;
      document.getElementById("email").innerText = data.email;
      document.getElementById("phone").innerText = data.phone;
      document.getElementById("service").innerText = data.service;
      document.getElementById("date").innerText = data.date;
      document.getElementById("time").innerText = data.timeSlot;
      document.getElementById("status").innerText = data.status;

      /* IMPORTANT FIX */
      document.getElementById("total").innerText = data.total || 0;

    })
    .catch(err => {
      console.error("ERROR LOADING BOOKING:", err);
    });

}
</script>

</body>
</html>
