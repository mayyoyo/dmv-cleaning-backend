<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Confirmed</title>

<link rel="stylesheet" href="css/success.css">

<!-- IMPORTANT CONFIG ORDER -->
<script src="config.js"></script>

<script>
  const API = window.API || "https://dmv-cleaning-backend.onrender.com/api";
  const BASE_URL = window.BASE_URL || "https://dmv-cleaning-backend.onrender.com";
</script>

</head>

<body>

<div class="wrapper">

  <div class="success-header">
    <div class="checkmark">✔</div>
    <h1>Booking Confirmed</h1>
    <p>DMV Cleaning Services LLC</p>
  </div>

  <div class="card">

    <div class="details">

      <div class="row">
        <span>Booking ID</span>
        <b id="bookingId"></b>
      </div>

      <div class="row">
        <span>Status</span>
        <b id="status"></b>
      </div>

      <div class="divider"></div>

      <div class="row"><span>Name</span><b id="name"></b></div>
      <div class="row"><span>Email</span><b id="email"></b></div>
      <div class="row"><span>Phone</span><b id="phone"></b></div>

      <div class="divider"></div>

      <div class="row"><span>Service</span><b id="service"></b></div>
      <div class="row"><span>Date</span><b id="date"></b></div>
      <div class="row"><span>Time</span><b id="time"></b></div>

    </div>

    <div class="price-box">
      <p>Total Due</p>
      <h2>$<span id="total">0</span></h2>
    </div>

    <!-- PAY REMAINING BUTTON -->
    <div style="text-align:center; margin:15px 0;">
      <button onclick="payRemaining()" class="btn primary">
        💰 Pay Remaining Balance
      </button>
    </div>

    <!-- INVOICE -->
    <div style="text-align:center;">
      <a id="download" class="btn" target="_blank">
        📄 Download Invoice
      </a>
    </div>

  </div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");

/* ================= LOAD BOOKING ================= */
async function loadBooking() {
  try {

    if (!sessionId) {
      document.body.innerHTML = "<h2>❌ Missing session ID</h2>";
      return;
    }

    const res = await fetch(`${API}/public-bookings`);
    const bookings = await res.json();

    const booking = bookings.find(
      b => b.stripeSessionId === sessionId
    );

    if (!booking) {
      document.body.innerHTML =
        "<h2>⏳ Processing booking... refresh in a few seconds</h2>";

      setTimeout(() => location.reload(), 4000);
      return;
    }

    document.getElementById("bookingId").innerText = booking.id;
    document.getElementById("status").innerText = booking.status;

    document.getElementById("name").innerText = booking.name || "";
    document.getElementById("email").innerText = booking.email || "";
    document.getElementById("phone").innerText = booking.phone || "";

    document.getElementById("service").innerText = booking.service || "";
    document.getElementById("date").innerText = booking.date || "";
    document.getElementById("time").innerText = booking.timeSlot || "";

    document.getElementById("total").innerText = booking.price || 0;

    document.getElementById("download").href =
      `${API}/invoice/${booking.id}`;

  } catch (err) {
    console.error(err);
    document.body.innerHTML =
      "<h2>⚠ Error loading booking</h2>";
  }
}

/* ================= PAY REMAINING (STRIPE) ================= */
async function payRemaining() {
  const bookingId = document.getElementById("bookingId").innerText;

  const res = await fetch(`${API}/pay-remaining`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bookingId })
  });

  const data = await res.json();

  if (data.url) {
    window.location.href = data.url;
  } else {
    alert(data.message || "Payment failed");
  }
}

loadBooking();

</script>

</body>
</html>
