<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Booking Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/tracking.css">

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body>

<div class="header">
  📍 Live Booking Tracking
</div>

<div class="card">
  <h2>Booking Status</h2>
  <p id="status" class="status">Loading...</p>
</div>

<div class="card">
  <h3>Service Info</h3>
  <p id="info">Loading...</p>
</div>

<script>

const API = "https://dmv-cleaning-backend.onrender.com/api";
const socket = io("https://dmv-cleaning-backend.onrender.com");

/* ================= GET BOOKING ID ================= */
const urlParams = new URLSearchParams(window.location.search);
const bookingId = urlParams.get("id");

/* ================= LOAD BOOKING ================= */
async function loadBooking() {

  try {

    const res = await fetch(API + "/booking/" + bookingId);
    const data = await res.json();

    document.getElementById("status").innerText = data.status || "Pending";

    document.getElementById("info").innerHTML = `
      Service: ${data.service || "-"}<br>
      Date: ${data.date || "-"}<br>
      Total: $${data.total || 0}
    `;

  } catch (err) {
    console.error("LOAD ERROR:", err);
    document.getElementById("status").innerText = "Error loading booking";
  }
}

loadBooking();

/* ================= LIVE SOCKET UPDATES ================= */
socket.on("booking-updated", (booking) => {

  if (!bookingId) return;

  if (booking.id == bookingId) {

    document.getElementById("status").innerText = booking.status;

    document.getElementById("info").innerHTML = `
      Service: ${booking.service}<br>
      Date: ${booking.date}<br>
      Total: $${booking.total}
    `;
  }
});

</script>

</body>
</html>
